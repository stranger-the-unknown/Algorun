name: algorun
description: "Algorun — construct the algorithm, never type it."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  algorun_engine:
    path: packages/algorun_engine
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/worlds.json
    - assets/puzzles/world_01/
    - assets/puzzles/world_02/
    - assets/puzzles/world_03/
    - assets/puzzles/world_05/
    - assets/puzzles/world_06/
    - assets/puzzles/world_10/
